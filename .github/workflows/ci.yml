name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install matching Chromium and Linux dependencies
        run: pnpm run test:install --with-deps
      - name: Check root files and affected packages
        run: pnpm run ci
      - name: Retain browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            packages/*/playwright-report/
            packages/*/test-results/
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7
          if-no-files-found: warn
